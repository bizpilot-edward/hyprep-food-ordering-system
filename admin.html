<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin | HYPREP</title><link rel="stylesheet" href="style.css"></head>
<body data-page="admin"><header class="site-header"><a class="wordmark" href="admin.html"><span class="brand-mark small">H</span> HYPREP <small>ADMIN CONSOLE</small></a><nav><a href="menu.html">View menu</a><span id="userEmail" class="user-chip"></span><button id="logoutBtn" class="btn btn-outline small-btn">Log out</button></nav></header>
<main class="page-wrap"><section class="page-intro"><p class="eyebrow">CONTROL CENTRE</p><h1>Admin dashboard</h1><p class="muted">Manage your menu and keep every order moving.</p></section>
<div class="admin-tabs"><button id="showMenuBtn" class="tab-btn active">Menu management</button><button id="showOrdersBtn" class="tab-btn">Order management</button></div><div id="adminMessage" class="notice"></div>
<section id="menuManagement" class="admin-section"><div class="admin-layout"><form id="foodForm" class="admin-form"><div><p class="eyebrow">MENU EDITOR</p><h2 id="foodFormTitle">Add a food item</h2></div><input type="hidden" id="foodId"><label>Food name<input id="foodName" required placeholder="e.g. Jollof Rice"></label><div class="two-col"><label>Price (₦)<input id="foodPrice" type="number" min="1" step="1" required placeholder="3500"></label><label>Category<select id="foodCategory" required><option value="">Choose category</option><option>Rice</option><option>Meals</option><option>Snacks</option><option>Drinks</option><option>Other</option></select></label></div><label>Food photo <small class="muted">(JPG, PNG or WEBP; maximum 2MB)</small><input id="foodPhoto" type="file" accept="image/jpeg,image/png,image/webp"></label><label>Or paste an image URL<input id="foodImageUrl" type="url" placeholder="https://..."></label><label class="check-label"><input id="foodAvailable" type="checkbox" checked> Available to order</label><button class="btn btn-dark full" type="submit" id="saveFoodBtn">Save food item</button><button class="btn btn-quiet full hidden" type="button" id="cancelEditBtn">Cancel editing</button></form><div class="admin-menu-area"><div class="section-heading"><div><p class="eyebrow">LIVE MENU</p><h2>Food items</h2></div><span id="adminFoodCount" class="count-chip">0 items</span></div><div id="adminFoodGrid" class="admin-food-grid"><div class="empty-state">Loading menu…</div></div></div></div></section>
<section id="orderManagement" class="admin-section hidden"><div class="section-heading"><div><p class="eyebrow">FULFILMENT</p><h2>All customer orders</h2></div><button id="refreshOrdersBtn" class="btn btn-outline small-btn">Refresh</button></div><div id="adminOrdersList" class="orders-list"><div class="empty-state">Loading orders…</div></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></body></html>
